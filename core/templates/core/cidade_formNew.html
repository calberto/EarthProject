<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Cidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Customização do Modal */
        .modal-content {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: none;
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: none;
            padding: 20px 25px;
            position: relative;
        }

        .modal-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.4rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title i {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .btn-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            opacity: 0.8;
            transition: all 0.3s ease;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-close:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px 25px;
            background: #f8f9fa;
        }

        /* Estilização dos campos do formulário */
        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .form-control:hover {
            border-color: #ced4da;
        }

        /* Estilização dos selects */
        .form-select {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Modal Footer */
        .modal-footer {
            background: white;
            border-top: 1px solid #e9ecef;
            padding: 20px 25px;
            gap: 10px;
        }

        /* Botões customizados */
        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        /* Animações */
        .modal.fade .modal-dialog {
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translate(0, -50px) scale(0.95);
        }

        .modal.show .modal-dialog {
            transform: translate(0, 0) scale(1);
        }

        /* Loading state para o botão */
        .btn-loading {
            position: relative;
            pointer-events: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsividade */
        @media (max-width: 576px) {
            .modal-dialog {
                margin: 10px;
            }
            
            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 15px 20px;
            }
        }

        /* Indicadores de campo obrigatório */
        .required-field::after {
            content: "*";
            color: #dc3545;
            margin-left: 4px;
        }

        /* Mensagens de erro */
        .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 5px;
        }

        .form-control.is-invalid {
            border-color: #dc3545;
        }
    </style>
</head>

<form id="cidade-form" method="post" action="{% url 'core_salvar_cidade' %}">
{% csrf_token %}
{% if form.instance.id %}
    <input type="hidden" name="id" value="{{ form.instance.id }}">
{% endif %}
<div class="modal-header">
    <h5 class="modal-title">
        {% if form.instance.id %}
            Editar Cidade
        {% else %}
            Novo Cidade
        {% endif %}
    </h5>
    
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<div class="modal-body">
    {{ form|crispy }}
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-primary">Salvar</button>
</div>
</form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = new bootstrap.Modal(document.getElementById('cidadeModal'));
            const form = document.getElementById('cidade-form');
            const submitBtn = document.getElementById('submit-btn');
            
            // Função para limpar o formulário
            function clearForm() {
                form.reset();
                document.getElementById('cidade-id').value = '';
                document.getElementById('modal-title-text').textContent = 'Nova Cidade';
                clearErrors();
            }
            
            // Função para limpar erros de validação
            function clearErrors() {
                const errorElements = form.querySelectorAll('.invalid-feedback');
                const invalidInputs = form.querySelectorAll('.is-invalid');
                
                errorElements.forEach(el => el.textContent = '');
                invalidInputs.forEach(input => input.classList.remove('is-invalid'));
            }
            
            // Função para mostrar erros de validação
            function showErrors(errors) {
                clearErrors();
                
                for (const [field, messages] of Object.entries(errors)) {
                    const input = form.querySelector(`[name="${field}"]`);
                    const errorElement = document.getElementById(`${field}-error`);
                    
                    if (input && errorElement) {
                        input.classList.add('is-invalid');
                        errorElement.textContent = messages.join(', ');
                    }
                }
            }
            
            // Função para popular o formulário (modo edição)
            function populateForm(data) {
                document.getElementById('cidade-id').value = data.id || '';
                document.getElementById('id_nome').value = data.nome || '';
                document.getElementById('id_estado').value = data.estado || '';
                document.getElementById('id_populacao').value = data.populacao || '';
                document.getElementById('modal-title-text').textContent = data.id ? 'Editar Cidade' : 'Nova Cidade';
            }
            
            // Event listener para limpar o form quando o modal é fechado
            document.getElementById('cidadeModal').addEventListener('hidden.bs.modal', function() {
                clearForm();
            });
            
            // Event listener para o submit do formulário
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Adicionar estado de loading
                submitBtn.classList.add('btn-loading');
                submitBtn.disabled = true;
                
                // Simular requisição AJAX
                const formData = new FormData(form);
                
                // Aqui você faria a requisição real para o Django
                setTimeout(() => {
                    // Simular sucesso
                    console.log('Dados do formulário:', Object.fromEntries(formData));
                    
                    // Remover loading
                    submitBtn.classList.remove('btn-loading');
                    submitBtn.disabled = false;
                    
                    // Fechar modal
                    modal.hide();
                    
                    // Aqui você atualizaria a lista/tabela na página
                    alert('Cidade salva com sucesso!');
                    
                }, 1500);
                
                // Exemplo de como tratar erros:
                /*
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                    }
                })
                .then(response => response.json())
                .then(data => {
                    submitBtn.classList.remove('btn-loading');
                    submitBtn.disabled = false;
                    
                    if (data.success) {
                        modal.hide();
                        // Atualizar lista/tabela
                    } else {
                        showErrors(data.errors);
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    submitBtn.classList.remove('btn-loading');
                    submitBtn.disabled = false;
                });
                */
            });
            
            // Função global para abrir o modal (pode ser chamada de outros scripts)
            window.openCidadeModal = function(data = {}) {
                populateForm(data);
                modal.show();
            };
            
            // Exemplo de como abrir o modal para edição:
            // window.openCidadeModal({id: 1, nome: 'São Paulo', estado: 'SP', populacao: 12000000});
        });
    </script>
</body>
</html>
