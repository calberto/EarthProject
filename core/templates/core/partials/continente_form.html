
{% load crispy_forms_tags %}

<form id="continente-form" method="post" action="{% url 'core_salvar_continente' %}">
    {% csrf_token %}
    {% if form.instance.id %}
        <input type="hidden" name="id" value="{{ form.instance.id }}">
    {% endif %}
    <div class="modal-header">
        <h5 class="modal-title">
            {% if form.instance.id %}
                Editar Continente
            {% else %}
                Novo Continente
            {% endif %}
        </h5>
        
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
    </div>
    <div class="modal-body">
        {{ form|crispy }}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
    // Garantir que os botões de fechar funcionem
    const closeButtons = document.querySelectorAll('[data-bs-dismiss="modal"]');
    closeButtons.forEach(button => {
        button.addEventListener('click', function() {
            const modalElement = document.querySelector('.modal');
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            if (modalInstance) {
                modalInstance.hide();
            }
        });
    });
    
    // Verificar se o modal está sendo inicializado corretamente
    const modalElement = document.querySelector('.modal');
    if (modalElement && !bootstrap.Modal.getInstance(modalElement)) {
        new bootstrap.Modal(modalElement);
    }
});
</script>
